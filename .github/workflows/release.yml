name: Release

# Single job, triggered only by `push` to main -- deliberately not split into a second workflow
# triggered by tag push. GitHub Actions does not re-trigger `on: push`/`on: <tag-push>` workflows for
# a push made with the default GITHUB_TOKEN (its documented anti-recursion rule), so a tag/commit this
# job pushes with that token would never start a second workflow: splitting the pipeline that way
# would leave the tag-triggered half permanently unrun. Everything -- version decision, file bump,
# contract/contract.json, CHANGELOG.md, tag, GitHub Release -- happens here instead (ADR-011).
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # queue, never cancel a release partway through

permissions:
  contents: write
  # write: the step before release-drafter removes release-level labels a bot put on Dependabot pull requests
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags: compute_version.sh and render_changelog.sh need both

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read the current version (pyproject.toml)
        id: current
        run: |
          CURRENT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      # Dependabot labels a pull request `major` when the dependency it bumps moved a major version, which says
      # nothing about this product's version. A release-level label on a Dependabot pull request counts only when a
      # person applied it; a failure here fails the release instead of resolving from unchecked labels.
      - name: Drop release-level labels a bot put on Dependabot pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/dependabot_release_labels.py

      # Velisa ADR-023: pull requests labelled only chore / ci / docs / test release nothing. release-drafter's
      # `default` cannot say "no release", so release_gate.py answers that from the merged pull requests' labels.
      - name: Decide whether anything merged since the latest tag is releasable
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_gate.py

      - name: Resolve the next version (release-drafter, dry run)
        id: drafter
        continue-on-error: true   # bootstrap (no prior tag) can leave this with nothing to resolve;
                                  # compute_version.sh only reads its output when it actually needs to
        # v7: v6 has no dry-run input (it was silently ignored), and v7 dropped disable-autolabeler
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          dry-run: true
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide this push's release version
        id: compute
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          DRAFTER_RESOLVED_VERSION: ${{ steps.drafter.outputs.resolved_version }}  # underscore: resolved-version was always empty
          RELEASABLE: ${{ steps.gate.outputs.releasable }}
        run: bash .github/scripts/compute_version.sh

      - name: Nothing to release
        if: steps.compute.outputs.should_release != 'true'
        run: echo "v${{ steps.compute.outputs.next_version }} is already tagged, or nothing releasable was merged; nothing to do."

      - name: Install the package (needed to regenerate the committed contract file)
        if: steps.compute.outputs.should_release == 'true'
        run: python3 -m pip install -q -e .

      - name: Bump version files
        if: steps.compute.outputs.should_release == 'true'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
          REGENERATE_CONTRACT: "1"
        run: bash .github/scripts/bump_version_files.sh

      # The tag's contract/contract.json must be that tag's own contract output and report its version.
      - name: Check the contract file against the version
        if: steps.compute.outputs.should_release == 'true'
        env:
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: |
          python3 contract/generate.py --check
          python3 - <<'PYEOF'
          import json, os
          doc = json.load(open("contract/contract.json", encoding="utf-8"))
          want = os.environ["NEXT_VERSION"]
          skill = doc.get("skill")
          got = {"version": doc.get("version"), "skill.version": skill.get("version") if isinstance(skill, dict) else want}
          bad = {k: v for k, v in got.items() if v != want}
          if bad:
              raise SystemExit(f"contract/contract.json does not report {want}: {bad}")
          print(f"contract/contract.json reports {want}")
          PYEOF

      - name: Render CHANGELOG.md and release notes
        if: steps.compute.outputs.should_release == 'true'
        env:
          LATEST_TAG: ${{ steps.compute.outputs.latest_tag }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: bash .github/scripts/render_changelog.sh

      - name: Commit and tag (not pushed yet)
        if: steps.compute.outputs.should_release == 'true'
        env:
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/ingest_skill/__init__.py CHANGELOG.md contract/contract.json
          if git diff --cached --quiet; then
            echo "no file changes to commit for v${NEXT_VERSION} (changelog-only release notes still apply to the tag)"
          else
            git commit -m "chore(release): v${NEXT_VERSION}"
          fi
          # An annotated tag, pushed by name: --follow-tags skips lightweight tags.
          git tag -a "v${NEXT_VERSION}" -m "v${NEXT_VERSION}"

      # The release commit is pushed with GITHUB_TOKEN, so no workflow runs on it on main: test it here, before
      # it is pushed. A failure stops the release; main and the tags stay as they were (Velisa ADR-023).
      - name: Test the release commit before pushing it
        if: steps.compute.outputs.should_release == 'true'
        run: |
          python3 -m unittest discover -s tests

      - name: Push the release commit and tag
        if: steps.compute.outputs.should_release == 'true'
        env:
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: git push origin HEAD:main "refs/tags/v${NEXT_VERSION}"

      - name: Create the GitHub Release
        if: steps.compute.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: gh release create "v${NEXT_VERSION}" --title "v${NEXT_VERSION}" --notes-file release_notes.md
