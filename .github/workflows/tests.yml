name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # requires-python = ">=3.9" in pyproject.toml: test the floor, and the versions people run.
        python-version: ["3.9", "3.11", "3.12"]
        # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 build in actions/setup-python: run 3.9 on 24.04. See docs/adr/ADR-002.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The OS capability contract schema (read-only), for the contract test of ECOSYSTEM_ROADMAP.md step 1.
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/AI-video-production-OS
          path: _os
          sparse-checkout: registry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      # Standard library only: --hash xxh64 must be refused as HASH_UNAVAILABLE, sha256 + c4 must work.
      - run: python -m unittest discover -v -s tests
      - run: ingest contract --json
      # With the optional extra: the xxh64 offload / ASC MHL / verify tests run too. jsonschema is a test-only tool
      # (not a dependency): with it, `ingest contract --json` must validate against the OS schema (required here).
      - run: pip install -e ".[xxhash]" jsonschema
      - run: python -m unittest discover -v -s tests
        env:
          INGEST_REQUIRE_CONTRACT_SCHEMA: "1"
          INGEST_OS_CONTRACT_SCHEMA: ${{ github.workspace }}/_os/registry/capability_contract.schema.json
      - run: ingest doctor --json
