name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # requires-python = ">=3.9" in pyproject.toml: test the floor, and the versions people run.
        python-version: ["3.9", "3.11", "3.12"]
        # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 build in actions/setup-python: run 3.9 on 24.04. See docs/adr/ADR-002.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      # Standard library only: --hash xxh64 must be refused as HASH_UNAVAILABLE, sha256 + c4 must work.
      - run: python -m unittest -v tests/test_ingest.py
      - run: ingest contract --json
      - run: pip install -e ".[xxhash]"
      # With the optional extra: the xxh64 offload / ASC MHL / verify tests run too.
      - run: python -m unittest -v tests/test_ingest.py
      - run: ingest doctor --json
