[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest-skill"
version = "0.1.0"
description = "Verified media offload from camera cards and recorders: sha256 (or xxh64) read-back on every copy, dual backup, manifest, ASC MHL history and clip inventory. Local; optional URL fetch through yt-dlp."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["media", "offload", "ingest", "backup", "checksum", "sha256", "xxhash", "asc-mhl", "mhl", "dit", "camera-card", "agent-skill", "video-production"]
dependencies = []

[project.optional-dependencies]
# xxh64 offloads (--hash xxh64) and checking xxh3 / xxh128 ASC MHL records. Without it those are UNAVAILABLE.
xxhash = ["xxhash>=3.0"]
# `ingest fetch <url>`: yt-dlp, used as a library (ADR-005). Without it fetch is UNAVAILABLE; nothing else needs it.
# Floor per Python (ADR-006): 2026.7.4 clears every published advisory but needs Python 3.10; 3.9 gets its last release.
fetch = ["yt-dlp>=2026.7.4; python_version >= '3.10'", "yt-dlp>=2025.10.14; python_version < '3.10'"]

[project.scripts]
ingest = "ingest_skill.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/ingest-skill"

[tool.setuptools.packages.find]
where = ["src"]
